<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>OSRS Suggestify</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1b1b1f;
      color: #e8e8ea;
    }
    main { padding: 1.25rem; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    .card {
      background: #26262c;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: #9a9aa3; margin-bottom: 0.35rem; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #1b1b1f;
      border: 1px solid #3a3a42;
      border-radius: 6px;
      color: #e8e8ea;
      padding: 0.55rem 0.7rem;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
    button {
      background: #3b6ea5;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button.secondary { background: #3a3a42; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: #ff8a8a; font-size: 0.85rem; margin-top: 0.6rem; }
    .muted { color: #9a9aa3; font-size: 0.8rem; }
    .rsn { font-size: 1.1rem; font-weight: 600; }
    .stats { display: flex; gap: 1.5rem; margin: 0.5rem 0 0.75rem; }
    .stat .value { font-size: 1.05rem; font-weight: 600; }
    .stat .label { font-size: 0.72rem; color: #9a9aa3; text-transform: uppercase; letter-spacing: 0.04em; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #9a9aa3; margin: 0.9rem 0 0.5rem; }
    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.35rem;
    }
    .skill {
      background: #1b1b1f;
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
      font-size: 0.75rem;
    }
    .skill .name { color: #9a9aa3; }
    .skill .lvl { font-weight: 600; }
    .skill.max .lvl { color: #7dd87d; }
    .activities { list-style: none; margin: 0; padding: 0; font-size: 0.82rem; }
    .activities li {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0.5rem;
      background: #1b1b1f;
      border-radius: 6px;
      margin-bottom: 0.3rem;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>OSRS Suggestify</h1>

    <section id="connect-card" class="card">
      <form id="connect-form">
        <label for="rsn-input">OSRS username (RSN)</label>
        <input id="rsn-input" name="rsn" type="text" maxlength="12" autocomplete="off"
               placeholder="e.g. Zezima" />
        <div class="row">
          <button id="connect-btn" type="submit">Connect</button>
          <span id="connect-status" class="muted"></span>
        </div>
        <div id="connect-error" class="error hidden"></div>
      </form>
    </section>

    <section id="account-card" class="card hidden">
      <div class="rsn" id="account-rsn"></div>
      <div class="stats">
        <div class="stat"><div class="value" id="stat-level">–</div><div class="label">Total level</div></div>
        <div class="stat"><div class="value" id="stat-xp">–</div><div class="label">Total XP</div></div>
        <div class="stat"><div class="value" id="stat-fetched">–</div><div class="label">Updated</div></div>
      </div>
      <div class="row">
        <button id="refresh-btn" type="button">Refresh</button>
        <button id="disconnect-btn" type="button" class="secondary">Disconnect</button>
      </div>
      <div id="account-error" class="error hidden"></div>

      <div id="progress-details">
        <h2>Skills</h2>
        <div id="skills-grid" class="skills"></div>
        <h2>Activities</h2>
        <ul id="activities-list" class="activities"></ul>
        <p id="activities-empty" class="muted hidden">No activity scores recorded yet.</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
