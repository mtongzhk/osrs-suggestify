<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>OSRS Suggestify</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1b1b1f;
      color: #e8e8ea;
    }
    main { padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    #state {
      background: #26262c;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 60vh;
      overflow: auto;
    }
    .controls { margin-top: 1rem; display: flex; gap: 0.75rem; align-items: center; }
    button {
      background: #3b6ea5;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    #ping-result { color: #9a9aa3; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>OSRS Suggestify</h1>
    <div id="state">Loading…</div>
    <div class="controls">
      <button id="ping-btn" type="button">Ping main process</button>
      <span id="ping-result"></span>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
